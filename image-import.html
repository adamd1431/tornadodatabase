<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Send an image · Tornado Database</title><link rel="icon" href="favicon.png"><link rel="stylesheet" href="image-import.css"></head>
<body class="image-import-page"><nav><a href="index.html">Tornado Database</a><a href="index.html?view=cyclones">Tropical cyclones</a></nav><main class="image-import-layout"><header><p class="image-import-eyebrow">BROWSER IMAGE UPLOAD</p><h1>Where should this image go?</h1><p>Choose a storm and category, then review the image before uploading.</p></header>
<section class="image-import-panel"><div id="imagePreview" class="image-import-preview"><p>Waiting for an image from the extension…</p></div><p id="imageFilename"></p><a id="imageSource" target="_blank" rel="noopener noreferrer" hidden>Original page ↗</a><details><summary>Choose a file instead</summary><label for="imageFile">Image file, up to 20 MB</label><input id="imageFile" type="file" accept="image/jpeg,image/png,image/gif,image/webp,image/avif,image/bmp"></details></section>
<form id="imageDestination" class="image-import-panel"><label for="stormType">Storm type</label><select id="stormType"><option value="cyclone">Tropical cyclone</option><option value="tornado">Tornado</option></select><label for="stormSearch">Search storms</label><input id="stormSearch" type="search" placeholder="Name or year"><label for="stormTarget">Storm</label><select id="stormTarget"><option value="">Loading storms…</option></select><p id="stormCount" class="image-import-hint"></p><label for="imageCategory">Upload category</label><select id="imageCategory"></select><p id="imageAccount" class="image-import-hint"></p><button id="reviewImage" type="submit" disabled>Review upload →</button><p id="imageImportStatus" role="status" aria-live="polite"></p></form></main><script type="module" src="image-import.js"></script></body></html>
