/* ── APPLY FILTERS ── */
function numberField(t, names) {
  for (const name of names) {
    const value = Number(t[name]);
    if (Number.isFinite(value)) return value;
  }
  return 0;
}

function tornadoYear(t) {
  const match = String(t.date || "").match(/^(\d{4})/);
  return match ? Number(match[1]) : null;
}

function dateTimeValue(t) {
  const time = new Date(t?.date || 0).getTime();
  return Number.isFinite(time) ? time : 0;
}

function dayOrderValue(t) {
  const value = Number(t?.day_order ?? t?.event_order ?? t?.sort_order ?? 0);
  return Number.isFinite(value) ? value : 0;
}

function sameEventDate(a, b) {
  return !!a?.date && !!b?.date && String(a.date) === String(b.date);
}

function suggestionEventDate(tornado) {
  const value = String(tornado?.date || "");
  return /^\d{4}-\d{2}-\d{2}$/.test(value) ? value : null;
}

function compareSameDayOrder(a, b) {
  return dayOrderValue(a) - dayOrderValue(b)
    || String(a.name || "").localeCompare(String(b.name || ""))
    || String(a.id || "").localeCompare(String(b.id || ""));
}

function compareDateNewest(a, b) {
  return dateTimeValue(b) - dateTimeValue(a) || compareSameDayOrder(a, b);
}

function compareDateOldest(a, b) {
  return dateTimeValue(a) - dateTimeValue(b) || compareSameDayOrder(a, b);
}

function sameDayGroupFor(tornado) {
  return allTornadoes
    .filter(item => sameEventDate(item, tornado))
    .sort(compareSameDayOrder);
}

function orderSnapshot(group) {
  return group.map((item, index) => ({
    id: item.id,
    name: item.name || "",
    day_order: dayOrderValue(item),
    display_order: index + 1
  }));
}

function swappedSameDaySnapshot(tornado, neighbor) {
  const group = sameDayGroupFor(tornado);
  const fromIndex = group.findIndex(item => String(item.id) === String(tornado.id));
  const toIndex = group.findIndex(item => String(item.id) === String(neighbor.id));
  if (fromIndex < 0 || toIndex < 0) return { before: [], after: [] };
  const before = orderSnapshot(group);
  const next = [...group];
  [next[fromIndex], next[toIndex]] = [next[toIndex], next[fromIndex]];
  const after = next.map((item, index) => ({
    id: item.id,
    name: item.name || "",
    day_order: index + 1,
    display_order: index + 1
  }));
  return { before, after };
}

function findRenderedNeighbor(tornadoId, direction) {
  const index = lastRenderedTornadoes.findIndex(item => String(item.id) === String(tornadoId));
  if (index < 0) return null;
  const tornado = lastRenderedTornadoes[index];
  const neighbor = lastRenderedTornadoes[index + direction];
  return sameEventDate(tornado, neighbor) ? neighbor : null;
}

function orderControlsHtml(tornado, index, sort) {
  if (!["newest", "oldest"].includes(sort) || !tornado?.date) return "";
  const previous = lastRenderedTornadoes[index - 1];
  const next = lastRenderedTornadoes[index + 1];
  if (!sameEventDate(tornado, previous) && !sameEventDate(tornado, next)) return "";
  const label = isAdmin ? "Change same-day order" : "Suggest same-day order switch";
  return `
    <div class="card-order-controls" aria-label="${label}">
      <button class="order-btn" type="button" data-order-direction="-1" title="${label}: move earlier" ${sameEventDate(tornado, previous) ? "" : "disabled"}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
      </button>
      <button class="order-btn" type="button" data-order-direction="1" title="${label}: move later" ${sameEventDate(tornado, next) ? "" : "disabled"}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14"/><path d="M19 12l-7 7-7-7"/></svg>
      </button>
    </div>`;
}

async function applySameDayOrderSwitch(tornado, neighbor) {
  const { before, after } = swappedSameDaySnapshot(tornado, neighbor);
  if (!after.length) return;

  const updates = after.map(item =>
    supabase.from("tornadoes").update({ day_order: item.day_order }).eq("id", item.id)
  );
  const results = await Promise.all(updates);
  const error = results.find(result => result.error)?.error;
  if (error) {
    alert(/day_order|schema cache|column/i.test(error.message || "")
      ? "Could not save order. Run supabase-order-switch-suggestions.sql first."
      : error.message);
    return;
  }

  allTornadoes = allTornadoes.map(item => {
    const next = after.find(row => String(row.id) === String(item.id));
    return next ? { ...item, day_order: next.day_order } : item;
  });

  await logOwnerAction(
    "Changed same-day tornado order",
    "tornadoes",
    tornado.id,
    `${tornado.name || "Tornado"} / ${neighbor.name || "Tornado"}`,
    { rows: before },
    { rows: after }
  );
  applyFilters();
}

async function submitOrderSwitchSuggestion(tornado, neighbor) {
  const { before, after } = swappedSameDaySnapshot(tornado, neighbor);
  if (!after.length) return;

  let suggestedBy = "Guest";
  let userId = null;
  if (currentUser) {
    userId = currentUser.id;
    try {
      const { data: profile } = await supabase
        .from("profiles")
        .select("username,email")
        .eq("id", currentUser.id)
        .maybeSingle();
      suggestedBy = profile?.username || currentUser.email || "User";
    } catch {
      suggestedBy = currentUser.email || "User";
    }
  }

  const { error } = await supabase.from("order_switch_suggestions").insert({
    tornado_a_id: tornado.id,
    tornado_b_id: neighbor.id,
    event_date: suggestionEventDate(tornado),
    suggested_by: userId,
    suggested_by_name: suggestedBy,
    before_order: before,
    after_order: after,
    status: "pending"
  });

  if (error) {
    alert(/order_switch_suggestions|schema cache|relation|permission|policy/i.test(error.message || "")
      ? "Could not submit the order suggestion. Run supabase-order-switch-suggestions.sql first."
      : error.message);
    return;
  }

  alert("Order switch suggested. An admin can approve it from the Order tab.");
}

window.handleTornadoOrderMove = async function(tornadoId, direction) {
  const tornado = allTornadoes.find(item => String(item.id) === String(tornadoId));
  const neighbor = findRenderedNeighbor(tornadoId, direction);
  if (!tornado || !neighbor) return;
  if (isAdmin) await applySameDayOrderSwitch(tornado, neighbor);
  else await submitOrderSwitchSuggestion(tornado, neighbor);
};

function strongestOutbreakTornado(members) {
  return [...members].sort((a, b) => intensityValue(b.intensity) - intensityValue(a.intensity))[0] || null;
}

function outbreakCoverTornado(outbreak, members) {
  const preferredId = String(outbreak?.cover_tornado_id || "");
  if (preferredId) {
    const preferred = members.find(t => String(t.id) === preferredId);
    if (preferred) return preferred;
  }
  return members.find(t => t.cover_image) || members[0] || null;
}

function preserveOpenOutbreaks(callback) {
  const openIds = [...listEl.querySelectorAll(".outbreak-item.open")]
    .map(item => String(item.dataset.outbreakId || ""));
  callback?.();
  listEl.querySelectorAll(".outbreak-item").forEach(item => {
    if (openIds.includes(String(item.dataset.outbreakId || ""))) item.classList.add("open");
  });
}

async function updateOutbreakCover(outbreakId, tornadoId) {
  const id = String(outbreakId || "");
  const outbreak = allOutbreaks.find(row => String(row.id) === id);
  if (!outbreak) return;
  const members = outbreakMembers(outbreak);
  const nextCoverId = members.some(t => String(t.id) === String(tornadoId || ""))
    ? String(tornadoId)
    : "";
  const previousCoverId = outbreak.cover_tornado_id || "";
  if (previousCoverId === nextCoverId) return;

  allOutbreaks = allOutbreaks.map(row => String(row.id) === id
    ? { ...row, cover_tornado_id: nextCoverId }
    : row
  );
  preserveOpenOutbreaks(() => window.applyFilters?.());

  const updated = allOutbreaks.find(row => String(row.id) === id);
  const localRows = readLocalOutbreaks().filter(row => String(row.id) !== id);
  if (updated?.source === "local") {
    saveLocalOutbreaks([...localRows, updated]);
    return;
  }

  try {
    const { error } = await supabase
      .from("outbreaks")
      .update({ cover_tornado_id: nextCoverId || null })
      .eq("id", id);
    if (error) throw error;
  } catch (error) {
    console.warn("Outbreak thumbnail change saved locally. Run supabase-outbreaks.sql to persist outbreak thumbnails in Supabase:", error);
    if (updated) saveLocalOutbreaks([...localRows, { ...updated, source: "local" }]);
  }
}

async function updateOutbreakOrder(outbreakId, tornadoId, direction) {
  if (!isAdmin) return;
  const id = String(outbreakId || "");
  const outbreak = allOutbreaks.find(row => String(row.id) === id);
  if (!outbreak) return;
  const members = outbreakMembers(outbreak);
  const fromIndex = members.findIndex(t => String(t.id) === String(tornadoId));
  const toIndex = fromIndex + Number(direction);
  if (fromIndex < 0 || toIndex < 0 || toIndex >= members.length) return;

  const nextMembers = [...members];
  [nextMembers[fromIndex], nextMembers[toIndex]] = [nextMembers[toIndex], nextMembers[fromIndex]];
  const nextOrder = nextMembers.map(t => String(t.id));

  allOutbreaks = allOutbreaks.map(row => String(row.id) === id
    ? { ...row, tornado_order: nextOrder }
    : row
  );
  preserveOpenOutbreaks(() => window.applyFilters?.());

  const updated = allOutbreaks.find(row => String(row.id) === id);
  const localRows = readLocalOutbreaks().filter(row => String(row.id) !== id);
  if (updated?.source === "local") {
    saveLocalOutbreaks([...localRows, updated]);
    return;
  }

  try {
    const { error } = await supabase
      .from("outbreaks")
      .update({ tornado_order: nextOrder })
      .eq("id", id);
    if (error) throw error;
  } catch (error) {
    console.warn("Outbreak order change saved locally. Run supabase-outbreaks.sql to persist outbreak order in Supabase:", error);
    if (updated) saveLocalOutbreaks([...localRows, { ...updated, source: "local" }]);
  }
}

            ${escAttr(dateLabel)}
          </div>` : ""}
          <div class="meta-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            ${uploadCount} upload${uploadCount === 1 ? "" : "s"}
          </div>
        </div>
      </div>
      <div class="card-image-wrap">
        ${renderCoverThumb(cover || {}, { original: true })}
      </div>
      <div class="card-arrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
    </div>
    <div class="outbreak-members">
      ${coverPicker}
      <div class="outbreak-member-grid">${memberButtons}</div>
    </div>
  </div>`;
}

window.applyFilters = function () {
  let filtered = [...allTornadoes];
  const { textTerms: query, dateTerms } = parseSearchTerms(searchInput.value);
  const intensity = intensityFilter.value;
  const year = yearFilter.value;
  const yearFrom = Number(yearFromFilter?.value || "");
  const yearTo = Number(yearToFilter?.value || "");
  const state = stateFilter.value;
  const media = mediaFilter?.value || "";
  const sort = sortFilter.value;
  const favoriteIds = getFavoriteIds();
  const favoritesOnly = !!favoritesOnlyFilter?.checked;

  function matchesSearch(t) {
    if (!query.length && !dateTerms.length) return true;
    if (!datesMatchSearchTerms(t.date, dateTerms)) return false;
    if (!query.length) return true;
    const name = foldSearchText(t.name);
    const date = foldSearchText(t.date);
    const states = normalizeStates(t).map(foldSearchText);
    const stateText = states.join(" ");
    const intensityText = foldSearchText(formatIntensity(t.intensity));
    const uploadText = String(uploadCountByTornado.get(String(t.id)) || 0);
    return query.every(q => {
      const norm = normalizeStateInput(q);
      const foldedNorm = foldSearchText(norm);
      return (foldedNorm && states.includes(foldedNorm)) ||
        name.includes(q) ||
        date.includes(q) ||
        stateText.includes(q) ||
        intensityText.includes(q) ||
        uploadText === q;
    });
  }

  if (currentIndexMode === "outbreaks") {
    const outbreakRows = allOutbreaks.map(outbreak => {
      const members = outbreakMembers(outbreak);
      const uploadCount = members.reduce((total, t) => total + (uploadCountByTornado.get(String(t.id)) || 0), 0);
      return {
        outbreak,
        members,
        uploadCount,
        strongest: strongestOutbreakTornado(members),
        newestDate: outbreak.dates.slice().sort().at(-1) || "",
        oldestDate: outbreak.dates.slice().sort()[0] || ""
      };
    }).filter(row => {
      const dates = row.outbreak.dates;
      const dateYears = dates.map(date => tornadoYear({ date })).filter(yearValue => yearValue !== null);
      const statesMatch = !state || row.members.some(t => normalizeStates(t).includes(normalizeStateInput(state) || ""));
      const intensityMatch = !intensity || row.members.some(t => formatIntensity(t.intensity) === intensity);
      const yearMatch = !year || dates.some(date => date.startsWith(year));
      const fromMatch = !yearFrom || dateYears.some(yearValue => yearValue >= yearFrom);
      const toMatch = !yearTo || dateYears.some(yearValue => yearValue <= yearTo);
      const mediaMatch = !media ||
        (media === "has_media" && row.uploadCount > 0) ||
        (media === "no_media" && row.uploadCount === 0);
      const favoritesMatch = !favoritesOnly || row.members.some(t => favoriteIds.includes(String(t.id)));
      const searchText = foldSearchText([
        row.outbreak.name,
        dates.join(" "),
        outbreakDateRangeLabel(dates),
        outbreakStatesLabel(row.members),
        row.uploadCount,
        row.members.map(t => `${t.name || ""} ${t.date || ""} ${formatIntensity(t.intensity)} ${normalizeStates(t).join(" ")}`).join(" ")
      ].join(" "));
      const textSearchMatch = !query.length || query.every(q => searchText.includes(q));
      const dateSearchMatch = datesMatchSearchTerms(dates, dateTerms) ||
        datesMatchSearchTerms(row.members.map(t => t.date), dateTerms);
      const searchMatch = textSearchMatch && dateSearchMatch;
      return row.members.length &&
        searchMatch &&
        intensityMatch &&
        yearMatch &&
        fromMatch &&
        toMatch &&
        statesMatch &&
        mediaMatch &&
        favoritesMatch;
    });

    if (sort === "newest") outbreakRows.sort((a, b) => b.newestDate.localeCompare(a.newestDate));
    if (sort === "oldest") outbreakRows.sort((a, b) => a.oldestDate.localeCompare(b.oldestDate));
    if (sort === "strongest") outbreakRows.sort((a, b) => intensityValue(b.strongest?.intensity) - intensityValue(a.strongest?.intensity));
    if (sort === "weakest") outbreakRows.sort((a, b) => intensityValue(a.strongest?.intensity) - intensityValue(b.strongest?.intensity));
    if (sort === "deadliest") outbreakRows.sort((a, b) =>
      b.members.reduce((total, t) => total + numberField(t, ["deaths","fatalities","dead"]), 0) -
      a.members.reduce((total, t) => total + numberField(t, ["deaths","fatalities","dead"]), 0)
    );
    if (sort === "most_injuries") outbreakRows.sort((a, b) =>
      b.members.reduce((total, t) => total + numberField(t, ["injuries","injured"]), 0) -
      a.members.reduce((total, t) => total + numberField(t, ["injuries","injured"]), 0)
    );
    if (sort === "state_az") outbreakRows.sort((a, b) => outbreakStatesLabel(a.members).localeCompare(outbreakStatesLabel(b.members)));
    if (sort === "rating_az") outbreakRows.sort((a, b) => formatIntensity(a.strongest?.intensity).localeCompare(formatIntensity(b.strongest?.intensity)));
    if (sort === "most_uploaded") outbreakRows.sort((a, b) => b.uploadCount - a.uploadCount || b.newestDate.localeCompare(a.newestDate));
    if (sort === "least_uploaded") outbreakRows.sort((a, b) => a.uploadCount - b.uploadCount || b.newestDate.localeCompare(a.newestDate));

    lastRenderedTornadoes = [];
    lastRenderedOutbreaks = outbreakRows.map(row => row.outbreak);
    resultsCountEl.innerHTML = `Showing <strong>${outbreakRows.length}</strong> of ${allOutbreaks.length} outbreaks`;

    if (!outbreakRows.length) {
      listEl.innerHTML = `<div class="empty-state"><div class="empty-icon">!</div><p>No outbreaks match your filters.</p></div>`;
      return;
    }

    listEl.innerHTML = outbreakRows.map((row, i) => renderOutbreakCard(row.outbreak, row, i)).join("");
    playInlineCoverVideos(listEl);
    return;
  }

  filtered = filtered.filter(t =>
    matchesSearch(t) &&
    (!intensity || formatIntensity(t.intensity) === intensity) &&
    (!year || t.date?.startsWith(year)) &&
    (!yearFrom || (tornadoYear(t) !== null && tornadoYear(t) >= yearFrom)) &&
    (!yearTo || (tornadoYear(t) !== null && tornadoYear(t) <= yearTo)) &&
    (!state || normalizeStates(t).includes(normalizeStateInput(state) || "")) &&
    (!media ||
      (media === "has_media" && (uploadCountByTornado.get(String(t.id)) || 0) > 0) ||
      (media === "no_media" && (uploadCountByTornado.get(String(t.id)) || 0) === 0)) &&
    (!favoritesOnly || favoriteIds.includes(String(t.id)))
  );

  if (sort === "newest") filtered.sort(compareDateNewest);
  if (sort === "oldest") filtered.sort(compareDateOldest);
  if (sort === "strongest") filtered.sort((a,b) => intensityValue(b.intensity) - intensityValue(a.intensity));
  if (sort === "weakest") filtered.sort((a,b) => intensityValue(a.intensity) - intensityValue(b.intensity));
  if (sort === "deadliest") filtered.sort((a,b) => numberField(b, ["deaths","fatalities","dead"]) - numberField(a, ["deaths","fatalities","dead"]));
  if (sort === "most_injuries") filtered.sort((a,b) => numberField(b, ["injuries","injured"]) - numberField(a, ["injuries","injured"]));
  if (sort === "state_az") filtered.sort((a,b) => (normalizeStates(a)[0] || "").localeCompare(normalizeStates(b)[0] || ""));
  if (sort === "rating_az") filtered.sort((a,b) => formatIntensity(a.intensity).localeCompare(formatIntensity(b.intensity)));
  if (sort === "most_uploaded") filtered.sort((a,b) =>
    (uploadCountByTornado.get(String(b.id)) || 0) - (uploadCountByTornado.get(String(a.id)) || 0) ||
    new Date(b.date || 0) - new Date(a.date || 0)
  );
  if (sort === "least_uploaded") filtered.sort((a,b) =>
    (uploadCountByTornado.get(String(a.id)) || 0) - (uploadCountByTornado.get(String(b.id)) || 0) ||
    new Date(b.date || 0) - new Date(a.date || 0)
  );

  resultsCountEl.innerHTML = `Showing <strong>${filtered.length}</strong> of ${allTornadoes.length} tornadoes`;

  if (!filtered.length) {
    lastRenderedTornadoes = [];
    listEl.innerHTML = `<div class="empty-state"><div class="empty-icon">🌪</div><p>No tornadoes match your filters.</p></div>`;
    const emptyText = listEl.querySelector(".empty-state p");
    if (emptyText) emptyText.textContent = favoritesOnly ? "No favorited tornadoes match your filters." : "No tornadoes match your filters.";
    return;
  }

  lastRenderedTornadoes = filtered;
  lastRenderedOutbreaks = [];
  listEl.innerHTML = filtered.map((t, i) => {
    const col = getEFColor(t.intensity);
    const bg = getIntensityBg(t.intensity);
    const label = formatIntensity(t.intensity);
    const states = normalizeStates(t).map(titleCase).join(" — ");
    const delay = Math.min(i * 0.03, 0.4);
    const uploadCount = uploadCountByTornado.get(String(t.id)) || 0;
    const isFavorite = favoriteIds.includes(String(t.id));
    const favoriteStar = isFavorite
      ? `<span class="card-favorite-star" aria-label="Favorited"><svg viewBox="0 0 24 24"><path d="M12 2.8l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.6l-5.8 3.1 1.1-6.5-4.7-4.6 6.5-.9L12 2.8z"/></svg></span>`
      : "";
    const orderControls = orderControlsHtml(t, i, sort);

    return `<div class="tornado-card" data-id="${t.id}" style="animation-delay:${delay}s">
      <div class="card-accent" style="background:${col}"></div>
      <div class="card-body">
        <div class="card-top">
          <div class="card-name">${t.name || "Unnamed tornado"}</div>
          <span class="intensity-badge" style="color:${col};border-color:${col}33;background:${bg}">${label}</span>
        </div>
        <div class="card-meta">
          ${states ? `<div class="meta-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            ${states}
          </div>` : ""}
          ${t.date ? `<div class="meta-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            ${t.date}
          </div>` : ""}
          <div class="meta-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            ${uploadCount} upload${uploadCount === 1 ? "" : "s"}
          </div>
        </div>
        ${orderControls}
      </div>
      <div class="card-image-wrap${isAdmin && t.cover_image ? " is-admin-adjustable" : ""}" ${isAdmin && t.cover_image ? `title="Adjust thumbnail"` : ""}>
        ${favoriteStar}
        ${renderCoverThumb(t, { original: true })}
      </div>
      <div class="card-arrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
    </div>`;
  }).join("");
  playInlineCoverVideos(listEl);
};

/* ── CARD CLICKS ── */
listEl.addEventListener("change", e => {
  const coverSelect = e.target.closest("[data-outbreak-cover-select]");
  if (!coverSelect) return;
  updateOutbreakCover(coverSelect.dataset.outbreakCoverSelect, coverSelect.value);
});

listEl.addEventListener("click", e => {
  const outbreakOrderButton = e.target.closest("[data-outbreak-order-direction]");
  if (outbreakOrderButton) {
    e.preventDefault();
    e.stopPropagation();
    if (!outbreakOrderButton.disabled) {
      updateOutbreakOrder(
        outbreakOrderButton.dataset.outbreakOrderId,
        outbreakOrderButton.dataset.outbreakMemberOrderId,
        Number(outbreakOrderButton.dataset.outbreakOrderDirection)
      );
    }
    return;
  }

  const memberButton = e.target.closest("[data-outbreak-member-id]");
  if (memberButton) {
    e.preventDefault();
    e.stopPropagation();
    const tornado = allTornadoes.find(t => String(t.id) === String(memberButton.dataset.outbreakMemberId));
    if (tornado) {
      saveIndexState(tornado.id);
      location.href = tornadoDetailUrl(tornado);
    }
    return;
  }

  const orderButton = e.target.closest("[data-order-direction]");
  if (orderButton) {
    e.preventDefault();
    e.stopPropagation();
    const card = orderButton.closest(".tornado-card");
    if (card && !orderButton.disabled) {
      handleTornadoOrderMove(card.dataset.id, Number(orderButton.dataset.orderDirection));
    }
    return;
  }

  const card = e.target.closest(".tornado-card");
  if (!card) return;

  if (card.dataset.outbreakId) {
    e.preventDefault();
    const outbreak = allOutbreaks.find(row => String(row.id) === String(card.dataset.outbreakId));
    location.href = outbreakDetailUrl(outbreak || { id: card.dataset.outbreakId });
    return;
  }

  const thumbnail = e.target.closest(".card-image-wrap");
  if (thumbnail?.classList.contains("is-admin-adjustable") && isAdmin) {
    e.preventDefault();
    e.stopPropagation();
    const tornado = allTornadoes.find(t => String(t.id) === String(card.dataset.id));
    openThumbnailAdjustModal(tornado, thumbnail);
    return;
  }
  saveIndexState(card.dataset.id);
  const tornado = allTornadoes.find(t => String(t.id) === String(card.dataset.id));
  location.href = tornadoDetailUrl(tornado || { id: card.dataset.id });
});

/* ── FORM ── */
window.openForm = () => formOverlay.classList.add("open");
window.closeForm = () => formOverlay.classList.remove("open");

formOverlay.addEventListener("click", e => {
  if (e.target === formOverlay) closeForm();
});

function setTornadoSubmitBusy(isBusy) {
  tornadoSubmitInFlight = isBusy;
  if (!submitTornadoBtn) return;
  submitTornadoBtn.disabled = isBusy;
  submitTornadoBtn.textContent = isBusy ? "Submitting..." : "Submit tornado";
}

window.createTornado = async function () {
  if (tornadoSubmitInFlight) return;

  const name = nameInput.value.trim();
  const state = stateInput.value.trim();
  const date = dateInput.value;
  const intensity = intensityInput.value;

  if (!name) { alert("Name is required."); return; }

  setTornadoSubmitBusy(true);

  try {
    const { data: { user } } = await supabase.auth.getUser();
    let submittedBy = "Anonymous";
    if (user) {
      const { data: profile } = await supabase.from("profiles").select("username").eq("id", user.id).maybeSingle();
      submittedBy = profileDisplayName(profile, user);
    }

    const adminNow = user ? (isAdmin || await checkAdmin(user)) : false;
    isAdmin = adminNow;
    const approvalStatus = adminNow ? "approved" : "pending";

    const { data: insertedTornado, error } = await insertTornadoRecord({
      name,
      states: state.split("-").map(s => normalizeStateInput(s)).filter(Boolean),
      date,
      intensity,
      status: approvalStatus,
      submitted_by: submittedBy
    }, user);

    if (error) {
      alert("Error: " + error.message);
      return;
    }
    if (adminNow) {
      await logOwnerAction("Added approved tornado", "tornadoes", insertedTornado?.id, name, null, insertedTornado);
    }

    alert(adminNow ? "Tornado added!" : "Submitted for review!");
    nameInput.value = ""; stateInput.value = ""; dateInput.value = "";
    closeForm();
    loadTornadoes();
  } finally {
    setTornadoSubmitBusy(false);
  }
};

/* ── MISC ── */
window.openRandomTornado = function () {
  if (!allTornadoes.length) { alert("No tornadoes loaded."); return; }
  const r = allTornadoes[Math.floor(Math.random() * allTornadoes.length)];
  location.href = tornadoDetailUrl(r);
};

window.goProfile = async () => {
  let user = currentUser;

  if (!user) {
    try {
      const { data: { session } } = await supabase.auth.getSession();
      user = session?.user ?? null;
    } catch {
      user = null;
    }
  }

  if (user) {
    const adminNow = isAdmin || await checkAdmin(user);
    if (adminNow && !hasCompletedAdminTest(user)) {
      location.href = localUrl("admin-test.html");
      return;
    }
  }

  location.href = localUrl(user ? "profile.html" : "login.html");
};

function dismissGuestPopup(permanent) {
  if (permanent) {
    localStorage.setItem("guestPopupDismissed", "true");
  }
  guestPopup.classList.remove("open");
}

window.continueGuest = () => {
  const dontShow = document.getElementById("guestDontShow")?.checked;
  dismissGuestPopup(dontShow);
};

document.getElementById("guestContinue").addEventListener("click", () => {
  const dontShow = document.getElementById("guestDontShow")?.checked;
  dismissGuestPopup(dontShow);
});

document.getElementById("guestSignIn").addEventListener("click", () => {
  guestPopup.classList.remove("open");
  location.href = localUrl("login.html");
});

window.saveUsername = async function (userId) {
  const input = document.getElementById("newUsername");
  const username = input?.value?.trim();
  if (!username || username.length < 3) { alert("Username must be at least 3 characters."); return; }
  const { error } = await supabase.from("profiles").upsert([{ id: userId, username }]);
  if (error) { alert(error.message); return; }
  const popup = document.getElementById("usernamePopup");
  if (popup) popup.remove();
  initAuth();
};

/* ── INIT ── */
async function startApp() {
  await initAuth();
  appStarted = true;
  await loadTornadoes();
}

startApp();

supabase.auth.onAuthStateChange(async (_event, session) => {
  const previousUserId = lastAuthUserId;
  currentUser = session?.user ?? null;
  lastAuthUserId = currentUser?.id ?? null;
  const [adminNow, publicTop100] = await Promise.all([
    checkAdmin(currentUser),
    loadTop100PublicVisible()
  ]);
  isAdmin = adminNow;
  top100PublicVisible = publicTop100;
  authResolved = true;

  updateProfileButton();
  updateGuestPrompt();

  if (appStarted && previousUserId !== lastAuthUserId) {
    await loadTornadoes();
  }
});
</script>
</body>
</html>
