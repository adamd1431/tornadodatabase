<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Recent Uploads</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <meta name="theme-color" content="#080e1a">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#080e1a;--surface:#0d1625;--card:#111b2e;--card-hover:#172032;
      --border:rgba(255,255,255,0.07);--border-hover:rgba(255,255,255,0.15);
      --text:#f0f4ff;--muted:#7a8baa;--muted2:#3d4f6a;
      --accent:#3b82f6;--accent-dim:rgba(59,130,246,0.12);--accent-b:rgba(59,130,246,0.35);
    }
    html{scroll-behavior:smooth}
    body{
      min-height:100vh;
      overflow-x:hidden;
      background:linear-gradient(180deg,#080e1a 0%,#09111f 52%,#0a1020 100%);
      color:var(--text);
      font-family:"Inter",sans-serif;
    }
    body::before{
      content:"";
      position:fixed;
      inset:0;
      z-index:-1;
      pointer-events:none;
      background:linear-gradient(120deg,rgba(59,130,246,0.08),transparent 34%,rgba(34,197,94,0.055) 72%,transparent);
      opacity:.85;
    }
    .topnav{
      position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;
      height:58px;padding:0 24px;background:rgba(8,14,26,0.88);backdrop-filter:blur(16px);
      border-bottom:1px solid var(--border);box-shadow:0 14px 40px rgba(0,0,0,0.16);
    }
    .topnav-brand{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none;font-size:15px;font-weight:700;letter-spacing:-.3px}
    .topnav-brand span{color:var(--accent)}
    .brand-mark{width:24px;height:24px;border-radius:7px;object-fit:cover;border:1px solid var(--border-hover);background:var(--surface);box-shadow:0 0 0 3px rgba(59,130,246,0.10)}
    .topnav-actions{display:flex;align-items:center;gap:8px}
    .btn{
      display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--border-hover);
      background:transparent;color:var(--muted);font-size:13px;font-weight:600;font-family:"Inter",sans-serif;
      cursor:pointer;text-decoration:none;white-space:nowrap;transition:color .15s,background .15s,border-color .15s,transform .15s;
    }
    .btn:hover{color:var(--text);background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.2);transform:translateY(-1px)}
    .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
    .main{max-width:1180px;margin:0 auto;padding:38px 24px 80px}
    .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:22px}
    .eyebrow{display:block;margin-bottom:10px;color:var(--accent);font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase}
    h1{font-size:clamp(34px,5vw,58px);line-height:.95;font-weight:900;letter-spacing:-2.4px}
    h1 em{font-style:normal;color:var(--accent)}
    .sub{max-width:560px;margin-top:10px;color:var(--muted);font-size:14px;line-height:1.6}
    .count-pill{flex-shrink:0;padding:10px 14px;border:1px solid var(--accent-b);border-radius:10px;background:var(--accent-dim);color:var(--accent);font-size:13px;font-weight:800}
    .toolbar{
      display:grid;grid-template-columns:minmax(220px,1fr) auto;gap:12px;align-items:center;
      margin-bottom:16px;padding:14px;background:rgba(17,27,46,0.78);border:1px solid var(--border);border-radius:14px;
    }
    .search-wrap{position:relative}
    .search-wrap svg{position:absolute;left:13px;top:50%;width:16px;height:16px;transform:translateY(-50%);color:var(--muted2);pointer-events:none}
    .search{
      width:100%;padding:11px 12px 11px 40px;background:var(--surface);border:1px solid var(--border);
      border-radius:9px;color:var(--text);font-family:"Inter",sans-serif;font-size:13px;outline:none;
    }
    .search:focus{border-color:rgba(59,130,246,.5);box-shadow:0 0 0 3px rgba(59,130,246,.12)}
    .tabs{display:flex;align-items:center;gap:7px;overflow-x:auto;padding-bottom:2px}
    .tab{
      flex-shrink:0;padding:8px 12px;border-radius:8px;border:1px solid var(--border-hover);
      background:transparent;color:var(--muted);font-size:12px;font-weight:700;font-family:"Inter",sans-serif;cursor:pointer;
    }
    .tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
    .upload-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
    .upload-card{
      min-width:0;overflow:hidden;border:1px solid var(--border);border-radius:12px;background:rgba(17,27,46,.92);
      box-shadow:0 14px 36px rgba(0,0,0,.12);transition:border-color .16s,background .16s,transform .16s,box-shadow .16s;
    }
    .upload-card:hover{border-color:var(--border-hover);background:rgba(23,32,50,.96);transform:translateY(-2px);box-shadow:0 18px 44px rgba(0,0,0,.18)}
    .preview{display:block;position:relative;aspect-ratio:1;background:#08101f;color:var(--muted2);overflow:hidden;text-decoration:none}
    .preview img,.preview video{width:100%;height:100%;object-fit:cover;display:block}
    .file-preview{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:9px;padding:18px;color:var(--muted)}
    .file-preview svg{width:34px;height:34px;color:var(--accent)}
    .file-preview span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:800;color:var(--text)}
    .media-chip{
      position:absolute;left:8px;top:8px;padding:4px 7px;border-radius:999px;background:rgba(8,14,26,.78);
      border:1px solid rgba(255,255,255,.12);color:#fff;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;
    }
    .upload-body{padding:12px}
    .upload-title{display:block;color:var(--text);text-decoration:none;font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .upload-title:hover{color:var(--accent)}
    .meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:11px;line-height:1.4}
    .meta span{display:inline-flex;align-items:center;min-width:0}
    .category{color:var(--accent);font-weight:800}
    .state{
      padding:56px 20px;text-align:center;color:var(--muted);font-size:14px;border:1px solid var(--border);
      border-radius:14px;background:rgba(17,27,46,.78);
    }
    .state strong{display:block;margin-bottom:6px;color:var(--text);font-size:16px}
    @media(max-width:900px){
      .page-head{align-items:flex-start;flex-direction:column}
      .toolbar{grid-template-columns:1fr}
      .upload-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
    }
    @media(max-width:640px){
      .topnav{padding:0 16px}
      .topnav .btn-label{display:none}
      .main{padding:28px 16px 64px}
      .upload-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
      h1{letter-spacing:-1.7px}
    }
    @media(max-width:380px){
      .upload-grid{grid-template-columns:1fr}
    }
  </style>
  <link rel="stylesheet" href="site-polish.css">
</head>
<body>
<nav class="topnav">
  <a class="topnav-brand" href="index.html">
    <img class="brand-mark" src="favicon.png" alt="">
    <span>Tornado</span> Database
  </a>
  <div class="topnav-actions">
    <a class="btn" href="index.html">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      <span class="btn-label">Database</span>
    </a>
    <a class="btn btn-primary" href="generator.html">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span class="btn-label">Generator</span>
    </a>
  </div>
</nav>

<main class="main">
  <header class="page-head">
    <div>
      <span class="eyebrow">Media Feed</span>
      <h1>Recent <em>Uploads</em></h1>
      <p class="sub">Newest approved tornado media from the database, with quick links back to each tornado.</p>
    </div>
    <div class="count-pill" id="uploadCount">Loading...</div>
  </header>

  <section class="toolbar" aria-label="Recent uploads filters">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="search" id="searchInput" type="search" placeholder="Search tornado, uploader, category, or file..." oninput="renderUploads()">
    </div>
    <div class="tabs" id="categoryTabs"></div>
  </section>

  <section id="uploadsGrid" class="upload-grid">
    <div class="state is-loading">Loading recent uploads...</div>
  </section>
</main>

<script type="module">
import { supabase } from './supabase.js';

const grid = document.getElementById('uploadsGrid');
const countEl = document.getElementById('uploadCount');
const searchInput = document.getElementById('searchInput');
const tabsEl = document.getElementById('categoryTabs');
let allUploads = [];
let activeCategory = 'all';

const CATEGORY_LABELS = {
  all: 'All',
  photos: 'Photos',
  videos: 'Videos',
  damage: 'Damage',
  radar: 'Radar',
  environment: 'Environment',
  research: 'Research',
  text_accounts: 'Text',
  misc: 'Misc',
  writeups: 'Writeups'
};

function esc(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

function titleCase(value) {
  return String(value || '').split(' ').filter(Boolean).map(word => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase()).join(' ');
}

function normalizeStates(tornado) {
  const raw = Array.isArray(tornado?.states)
    ? tornado.states
    : typeof tornado?.states === 'string'
      ? tornado.states.split('-')
      : [];
  return raw.map(s => titleCase(String(s).trim())).filter(Boolean);
}

function isImage(url) {
  return /\.(jpg|jpeg|png|webp|gif)(\?.*)?$/i.test(url || '');
}

function isVideo(url) {
  return /\.(mp4|webm|ogg|mov|m4v)(\?.*)?$/i.test(url || '');
}

function bandwidthImageUrl(url, width = 420, quality = 56) {
  const raw = String(url || '');
  if (!/\.(jpg|jpeg|png|webp)(\?.*)?$/i.test(raw)) return raw;
  try {
    const parsed = new URL(raw, window.location.href);
    if (!parsed.pathname.includes('/storage/v1/object/public/')) return raw;
    parsed.pathname = parsed.pathname.replace('/storage/v1/object/public/', '/storage/v1/render/image/public/');
    parsed.searchParams.set('width', String(width));
    parsed.searchParams.set('quality', String(quality));
    parsed.searchParams.set('resize', 'cover');
    return parsed.toString();
  } catch {
    return raw;
  }
}

function fileName(url) {
  try {
    return decodeURIComponent(new URL(url).pathname.split('/').pop() || 'Open file')
      .replace(/^\d{10,}-[a-z0-9]{6,16}-/i, '');
  } catch {
    return String(url || 'Open file').split('/').pop() || 'Open file';
  }
}

function categoryLabel(category) {
  return CATEGORY_LABELS[category] || titleCase(String(category || 'Upload').replace(/_/g, ' '));
}

function canOpenProfile(name) {
  return !!name && !['anonymous', 'user'].includes(String(name).trim().toLowerCase());
}

function profileUrl(name) {
  return `profile.html?user=${encodeURIComponent(String(name || '').trim())}`;
}

function formatDate(value) {
  if (!value) return 'Unknown date';
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return 'Unknown date';
  return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}

function uploadPreview(upload) {
  const url = upload.file_url || '';
  const category = categoryLabel(upload.category);
  if (isImage(url)) {
    return `<a class="preview" href="${esc(url)}" target="_blank" rel="noopener"><img src="${esc(bandwidthImageUrl(url, 420, 56))}" alt="${esc(upload.tornadoes?.name || category)}" loading="lazy" decoding="async"><span class="media-chip">${esc(category)}</span></a>`;
  }
  if (isVideo(url)) {
    return `<a class="preview" href="${esc(url)}" target="_blank" rel="noopener"><video src="${esc(url)}" preload="none" muted></video><span class="media-chip">${esc(category)}</span></a>`;
  }
  return `<a class="preview" href="${esc(url)}" target="_blank" rel="noopener"><div class="file-preview"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><span>${esc(fileName(url))}</span></div><span class="media-chip">${esc(category)}</span></a>`;
}

function uploadCard(upload) {
  const tornado = upload.tornadoes || {};
  const states = normalizeStates(tornado).join(' - ');
  const tornadoUrl = `tornado.html?id=${encodeURIComponent(upload.tornado_id || '')}`;
  const uploader = String(upload.uploaded_by || '').trim();
  const meta = [
    { text: categoryLabel(upload.category), cls: 'category' },
    states ? { text: states } : null,
    tornado.intensity ? { text: tornado.intensity } : null,
    uploader ? {
      html: `by ${canOpenProfile(uploader)
        ? `<a class="profile-link" href="${esc(profileUrl(uploader))}">${esc(uploader)}</a>`
        : esc(uploader)}`
    } : null,
    { text: formatDate(upload.created_at) }
  ].filter(Boolean);

  return `
    <article class="upload-card">
      ${uploadPreview(upload)}
      <div class="upload-body">
        <a class="upload-title" href="${esc(tornadoUrl)}">${esc(tornado.name || 'Unknown tornado')}</a>
        <div class="meta">
          ${meta.map(item => `<span class="${esc(item.cls || '')}">${item.html || esc(item.text)}</span>`).join('<span>&middot;</span>')}
        </div>
      </div>
    </article>`;
}

function renderTabs() {
  const categories = ['all', ...new Set(allUploads.map(upload => upload.category).filter(Boolean))];
  tabsEl.innerHTML = categories.map(category => `
    <button class="tab ${category === activeCategory ? 'active' : ''}" type="button" onclick="setCategory(${esc(JSON.stringify(category))})">
      ${esc(categoryLabel(category))}
    </button>`).join('');
}

window.setCategory = function(category) {
  activeCategory = category || 'all';
  renderTabs();
  renderUploads();
};

window.renderUploads = function() {
  const query = (searchInput.value || '').trim().toLowerCase();
  const filtered = allUploads.filter(upload => {
    if (activeCategory !== 'all' && upload.category !== activeCategory) return false;
    if (!query) return true;
    const tornado = upload.tornadoes || {};
    const haystack = [
      tornado.name,
      tornado.intensity,
      normalizeStates(tornado).join(' '),
      upload.category,
      upload.uploaded_by,
      upload.file_url
    ].join(' ').toLowerCase();
    return haystack.includes(query);
  });

  countEl.textContent = `${filtered.length} upload${filtered.length === 1 ? '' : 's'}`;

  if (!filtered.length) {
    grid.className = '';
    grid.innerHTML = `<div class="state"><strong>No uploads found</strong>Try a different search or category.</div>`;
    return;
  }

  grid.className = 'upload-grid';
  grid.innerHTML = filtered.map(uploadCard).join('');
};

async function loadRecentUploads() {
  grid.innerHTML = `<div class="state is-loading">Loading recent uploads...</div>`;
  const { data, error } = await supabase
    .from('uploads')
    .select('id,tornado_id,file_url,category,status,uploaded_by,created_at,tornadoes(name,date,intensity,states)')
    .eq('status', 'approved')
    .order('created_at', { ascending: false })
    .limit(120);

  if (error) {
    console.error(error);
    grid.className = '';
    grid.innerHTML = `<div class="state"><strong>Could not load uploads</strong>Please refresh and try again.</div>`;
    countEl.textContent = '0 uploads';
    return;
  }

  allUploads = data || [];
  renderTabs();
  renderUploads();
}

loadRecentUploads();
</script>
<script src="site-polish.js" defer></script>
</body>
</html>
